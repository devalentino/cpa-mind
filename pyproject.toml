[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpa-mind"
version = "0.1.0"
description = "Console tools for CPA offer analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "langchain-google-genai>=2,<3",
    "langchain-ollama>=0.3,<0.4",
    "langchain-openai>=0.2,<0.4",
    "langgraph>=0.2,<0.7",
    "markdownify>=0.13,<1",
    "playwright>=1.54,<2",
]

[project.scripts]
analyze = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agents", "cli", "llm", "startup", "state", "workflow"]

[tool.setuptools.packages.find]
where = ["src"]
