[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpa-mind"
version = "0.1.0"
description = "Console tools for CPA offer analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-google-genai>=2,<3",
    "langchain-openai>=0.2,<0.4",
    "langgraph>=0.2,<0.7",
]

[project.scripts]
analyze = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agents", "cli", "llm", "startup", "state", "tools", "workflow"]

[tool.setuptools.packages.find]
where = ["src"]
