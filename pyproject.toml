[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpa-mind"
version = "0.1.0"
description = "Console tools for CPA offer analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
analyze = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]
